[project]
name = "argus-video-inference"
version = "0.1.0"
description = "Dual-model CPU video inference with ByteTrack"
requires-python = ">=3.11"
dependencies = [
    "kagglehub>=0.3.12",
    "opencv-python>=4.10.0.84",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "lap>=0.5.12",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
